<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gem-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e6ffff" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <linearGradient id="gem-bottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00bcd4" />
      <stop offset="100%" stop-color="#006064" />
    </linearGradient>
    <linearGradient id="gem-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#80deea" />
      <stop offset="100%" stop-color="#00acc1" />
    </linearGradient>
    <linearGradient id="gem-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b2ebf2" />
      <stop offset="100%" stop-color="#00838f" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#glow)">
    <!-- Base diamond shape -->
    <polygon points="50,10 90,40 50,95 10,40" fill="#00e5ff" />
    
    <!-- Top facet -->
    <polygon points="50,10 75,40 25,40" fill="url(#gem-top)" />
    
    <!-- Bottom right facet -->
    <polygon points="75,40 90,40 50,95" fill="url(#gem-right)" />
    
    <!-- Bottom left facet -->
    <polygon points="10,40 25,40 50,95" fill="url(#gem-left)" />
    
    <!-- Bottom center facet -->
    <polygon points="25,40 75,40 50,95" fill="url(#gem-bottom)" />
    
    <!-- Top left facet -->
    <polygon points="50,10 25,40 10,40" fill="#ccffff" />
    
    <!-- Top right facet -->
    <polygon points="50,10 90,40 75,40" fill="#4dd0e1" />
    
    <!-- Highlight gleam -->
    <polygon points="48,15 52,15 30,38 26,38" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
