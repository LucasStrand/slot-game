<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="gold-grad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#ffffcc" />
      <stop offset="20%" stop-color="#ffd700" />
      <stop offset="80%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#996515" />
    </radialGradient>
    <radialGradient id="gold-inner" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#ffdf00" />
      <stop offset="100%" stop-color="#b8860b" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer rim -->
  <circle cx="50" cy="50" r="48" fill="url(#gold-grad)" />
  <!-- Inner rim indent -->
  <circle cx="50" cy="50" r="42" fill="url(#gold-inner)" stroke="#e6ac00" stroke-width="2" />
  
  <!-- Star shape in center -->
  <polygon points="50,20 58,40 80,40 62,55 70,75 50,62 30,75 38,55 20,40 42,40" 
           fill="#ffffff" opacity="0.8" filter="url(#glow)"/>
  <polygon points="50,23 56,41 75,41 60,53 66,70 50,60 34,70 40,53 25,41 44,41" 
           fill="#ffd700" />
  
  <!-- Highlight reflection -->
  <path d="M 50 4 A 46 46 0 0 1 90 26 A 50 50 0 0 0 10 26 A 46 46 0 0 1 50 4 Z" fill="#ffffff" opacity="0.5" />
</svg>
